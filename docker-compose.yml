services:
  postgres:
    image: postgres:16-alpine
    container_name: rt-helpdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rthelpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-rthelpdesk}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - rt_helpdesk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rthelpdesk}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rt-helpdesk-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3333}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rthelpdesk}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-rthelpdesk}?schema=public
      JWT_SECRET: ${JWT_SECRET:-changeme-super-secret-key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '${PORT:-3333}:3333'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333/api}
    container_name: rt-helpdesk-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  rt_helpdesk_postgres_data:
